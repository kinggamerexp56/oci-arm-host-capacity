name: Execute script

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    name: OCI launch instance
    steps:
      - uses: actions/checkout@v4

      - name: Install Oracle Cloud CLI
        run: |
          bash -c "$(curl -L https://githubusercontent.com)" -- --accept-all-defaults || true
          mkdir -p ~/.oci
          echo "Installing OCI CLI via pip..."
          pip install oci-cli

      - name: Setup OCI Credentials
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ vars.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          
          chmod 600 ~/.oci/config

      - name: Create Configuration Files
        run: |
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDpE7nUvO7u/pU9wI6x8I1oB5N7f6YfB7nUvO7u/pU9w oci-automation-key" > ~/public_key.pub
          echo '{"ocpus": 2, "memoryInGBs": 12}' > ~/shape_config.json

      - name: Attempt to Launch Instance
        run: |
          oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --availability-domain "IAD-AD-1" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://~/shape_config.json \
            --display-name "FreeAlwaysInstance" \
            --image-id "ocid1.image.oc1.iad.aaaaaaaamw65tng73bby6guzw6sh677rebyk66u47y6wge5pnt67m5qshseq" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ~/public_key.pub
